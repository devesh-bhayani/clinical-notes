name: CI

on:
  push:
    branches: [master]
  pull_request:

# Cancel superseded runs on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Lightweight, hermetic test config: stub inference, sample vocab, no network.
  ALLOW_STUB_INFERENCE: "1"
  DRUGBANK_VOCAB_PATH: data/drugbank_vocabulary.sample.csv
  SPLITS_DIR: data/splits
  HF_HUB_OFFLINE: "1"
  TRANSFORMERS_OFFLINE: "1"

jobs:
  test:
    name: Tests & eval smoke (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install lightweight dependencies
        run: pip install -r requirements-dev.txt

      - name: Run test suite with coverage
        run: pytest -q --cov=api --cov=eval --cov=data --cov-report=term-missing

      - name: Enforce guardrail coverage (safety-critical, >=90%)
        # The DrugBank guardrail is the last line of defense before model output
        # reaches users; the spec requires it to stay above 90% coverage.
        run: coverage report --include="api/guardrail.py" --fail-under=90

      - name: Eval suite smoke test (synthetic data)
        # --smoke asserts the suite runs and writes a report; the stub backend
        # is not expected to pass the quality gates on synthetic data.
        run: |
          python scripts/make_synthetic_data.py --output "$SPLITS_DIR"
          python eval/run_eval_suite.py --split test --smoke

  compliance:
    name: HIPAA compliance check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Scan tracked files for PHI signatures
        run: |
          # Exclude the compliance tooling and Claude command/agent docs: they
          # legitimately contain the PHI *pattern strings* (and the word "mimic"
          # in the checker's own filename) as documentation, not patient data.
          git ls-files '*.py' '*.csv' '*.md' '*.yaml' '*.yml' \
            | grep -vE '^\.claude/|^scripts/check_no_mimic_data\.py$' \
            | while read -r f; do
                python scripts/check_no_mimic_data.py "$f" || exit 1
              done
          echo "HIPAA compliance check passed."
